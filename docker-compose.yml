services:
  postgres:
    image: postgres:16-alpine
    container_name: waresys-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  db-backup:
    image: postgres:16-alpine
    container_name: waresys-db-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    # Daily pg_dump at BACKUP_TIME (validated before it counts), plus an
    # archive of uploaded files; keeps 14 daily + 8 weekly in ./backups.
    # See ops/backup/README.md. Take one on demand (e.g. before a deploy):
    #   docker compose exec db-backup sh /scripts/backup.sh once
    entrypoint: ["sh", "/scripts/backup.sh", "daemon"]

    environment:
      TZ: ${BACKUP_TZ:-Asia/Jakarta}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}

    volumes:
      - ./backups:/backups
      - ./ops/backup:/scripts:ro
      # Uploaded files, archived with each dump. Read-only.
      - backend_uploads:/uploads:ro

    healthcheck:
      test: ["CMD", "sh", "/scripts/backup.sh", "health"]
      interval: 10m
      timeout: 30s
      start_period: 15m
      retries: 1


  # Off-server copy of ./backups to Google Drive (rclone). OFF by default:
  # it only runs with the "offsite" profile, e.g. COMPOSE_PROFILES=offsite
  # in .env, after rclone is set up — see ops/backup/README.md.
  backup-offsite:
    image: rclone/rclone:1.71
    container_name: waresys-backup-offsite
    profiles: ["offsite"]
    restart: unless-stopped
    depends_on:
      - db-backup
    entrypoint: ["sh", "/scripts/offsite-sync.sh", "daemon"]

    environment:
      TZ: ${BACKUP_TZ:-Asia/Jakarta}
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-gdrive:WareSys/backups}
      OFFSITE_INTERVAL_MINUTES: ${OFFSITE_INTERVAL_MINUTES:-60}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}

    volumes:
      # Read-only: this container can never damage the local backups.
      - ./backups:/backups:ro
      - ./backups/status:/backups/status
      - ./ops/backup:/scripts:ro
      # rclone.conf with the Google Drive token — never committed.
      - ./secrets/rclone:/config/rclone

    healthcheck:
      test: ["CMD", "sh", "/scripts/offsite-sync.sh", "health"]
      interval: 30m
      timeout: 30s
      start_period: 2h
      retries: 1


  firebird:
    image: dimenziokft/firebird:2.5.9-sc
    container_name: waresys-firebird
    restart: unless-stopped

    environment:
      ISC_PASSWORD: ${FIREBIRD_PASSWORD}

    volumes:
      - firebird_data:/firebird/data
      - ./gdb-imports:/tmp/gdb-imports


  osrm:
    image: osrm/osrm-backend
    container_name: waresys-osrm
    restart: unless-stopped

    volumes:
      - ./osrm-data:/data

    # MLD pipeline: osrm-extract/partition/customize run once, out of band
    # (see osrm-data/ setup), producing sumatra-latest.osrm* — this
    # service just serves the routing API from the prepared files.
    #
    # Sumatra, not all of Indonesia — osrm-extract for the full country
    # needs ~16GB+ RAM (OOM-killed at 5.2GB on this 7.4GB sandbox before
    # finishing); Sumatra (~283MB extract, includes Batam/Kepulauan Riau)
    # fits comfortably. Swap this to indonesia-latest.osrm later on a
    # machine with enough RAM to run the same 4-command pipeline —
    # nothing else in the backend/frontend needs to change.
    # --max-table-size: /table (the VROOM travel matrix) is capped at 100
    # points by default; raised so a full day of stops fits in one call.
    command: osrm-routed --algorithm MLD --max-table-size 1000 /data/sumatra-latest.osrm

    ports:
      - "5001:5000"


  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    container_name: waresys-vroom
    restart: unless-stopped

    # Vehicle-routing optimizer (driver assignment + stop order). The
    # backend sends it the OSRM travel matrix with every request, so VROOM
    # never calls OSRM itself and needs no routing config. Internal only —
    # no published port.


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: waresys-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      firebird:
        condition: service_started
      osrm:
        condition: service_started
      vroom:
        condition: service_started

    environment:
      NODE_ENV: production

      DATABASE_URL: ${DATABASE_URL}
      OSRM_URL: ${OSRM_URL}
      VROOM_URL: ${VROOM_URL:-http://vroom:3000}

      SUPERADMIN_SECRET: ${SUPERADMIN_SECRET}
      JWT_SECRET: ${JWT_SECRET}

      LICENSE_FINGERPRINT: ${LICENSE_FINGERPRINT}
      LICENSE_KEY: ${LICENSE_KEY}

      KEYGEN_ACCOUNT_ID: ${KEYGEN_ACCOUNT_ID}
      KEYGEN_TOKEN: ${KEYGEN_TOKEN}

      PRINT_TOKEN_SECRET: ${PRINT_TOKEN_SECRET}

      FRONTEND_URL: ${FRONTEND_URL}
      HOST_MACHINE_GUID: ${HOST_MACHINE_GUID}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

      LICENSE_STATE_FILE: ${LICENSE_STATE_FILE}

      FIREBIRD_HOST: firebird
      FIREBIRD_PORT: ${FIREBIRD_PORT}

      FIREBIRD_USER: ${FIREBIRD_USER}
      FIREBIRD_PASSWORD: ${FIREBIRD_PASSWORD}

      FIREBIRD_LEGACY_HOST: firebird
      FIREBIRD_LEGACY_PORT: ${FIREBIRD_LEGACY_PORT}

      FIREBIRD_LEGACY_USER: ${FIREBIRD_LEGACY_USER}
      FIREBIRD_LEGACY_PASSWORD: ${FIREBIRD_LEGACY_PASSWORD}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      APP_URL: ${APP_URL}

      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}

    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - ./gdb-imports:/tmp/gdb-imports

    ports:
      - "3000:3000"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:3000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}

    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}

    container_name: waresys-frontend
    restart: unless-stopped
    depends_on:
    - backend
    ports:
    - "3001:3000"


volumes:
  postgres_data:
  backend_data:
  backend_uploads:
  firebird_data:
  gdb_imports: